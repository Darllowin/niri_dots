# =========================
# COMPILER & OPTIMIZATION
# =========================
COMMON_FLAGS="-O2 -march=native -pipe"

CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

LDFLAGS="
    -fuse-ld=lld
    -rtlib=compiler-rt
    -unwindlib=libunwind
    -Wl,--as-needed
    -Wl,-O2
    -Wl,--icf=all
    -Wl,--hash-style=gnu
"

# =========================
# BUILD SETTINGS
# =========================
MAKEOPTS="-j14"
EMERGE_DEFAULT_OPTS="--ask --verbose --jobs=8 --load-average=14"

FEATURES="ccache candy parallel-fetch parallel-install"

PORTAGE_NICENESS="5"

# =========================
# CPU / ARCH
# =========================
CPU_FLAGS_X86="
    aes avx avx2 bmi1 bmi2 f16c fma3
    mmx mmxext pclmul popcnt rdrand sha
    sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3
    vpclmulqdq
"

ABI_X86="64"

# =========================
# GRAPHICS
# =========================
VIDEO_CARDS="amdgpu radeonsi"
LLVM_TARGETS="X86 AMDGPU"

# =========================
# INPUT
# =========================
INPUT_DEVICE="libinput"

# =========================
# USE FLAGS
# =========================

# --- UI ---
UI_DISABLE="
    -X -xorg -qt5 -qt6 -gtk2 -gtk -gtk3
    -tk -aqua -emacs -kwallet -gnome -kde
"
UI_ENABLE="wayland policykit"

# --- MEDIA ---
MEDIA_DISABLE="
    -cups -dvd -cdrom -cdda -cdr -dvdr
    -mng -vnc -pulseaudio -inter
"
MEDIA_ENABLE="
    vaapi gstreamer pipewire ffmpeg vulkan gles2
    flatpak bluetooth truetype lcms icu gif svg
    jpeg png tiff avif mtp udisks
"

# --- SYSTEM ---
SYS_DISABLE="
    -elogind -telemetry -sysprof -modemmanager
    -accessibility -gpm -nvenc
"
SYS_ENABLE="systemd udev dbus iwd zram zstd lz4 threads"

# --- TOOLCHAIN ---
TOOL_DISABLE="-nls -doc -handbook -perl -ruby -vala"
TOOL_ENABLE="clang llvm llvm-libunwind lto pgo"

USE="${UI_DISABLE} ${MEDIA_DISABLE} ${SYS_DISABLE} ${TOOL_DISABLE} \
     ${UI_ENABLE} ${MEDIA_ENABLE} ${SYS_ENABLE} ${TOOL_ENABLE}"

# =========================
# LLVM / TOOLCHAIN
# =========================
CC="clang"
CXX="clang++"
LD="ld.lld"

AR="llvm-ar"
NM="llvm-nm"
RANLIB="llvm-ranlib"
READELF="llvm-readelf"
STRIP="llvm-strip"
OBJCOPY="llvm-objcopy"
SIZE="llvm-size"
STRINGS="llvm-strings"
OBJDUMP="llvm-objdump"

# =========================
# LANGUAGE OPTIMIZATION
# =========================
RUSTFLAGS="-C target-cpu=native -C opt-level=3 -C linker=clang -C link-arg=-fuse-ld=lld"
GOFLAGS="-p=14"
GOAMD64="v3"
PYTHON_OPTIMIZE="2"

# =========================
# CACHE
# =========================
CCACHE_DIR="/var/cache/ccache"
CCACHE_SIZE="30G"
CCACHE_COMPILERCHECK="content"
CCACHE_SLOPPINESS="time_macros"
CCACHE_CPP2="yes"

# =========================
# PORTAGE
# =========================
PORTAGE_COMPRESS="zstd"
PORTAGE_COMPRESS_FLAGS="-19"

GENTOO_MIRRORS="https://mirror.yandex.ru/gentoo-distfiles/"
ACCEPT_LICENSE="*"

LC_MESSAGES="C.UTF-8"
